name: Stage 2 thrust isolation verification
on:
  push:
    branches:
      - fix/reentry-stage1-stage2-controls-20261023
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check cruise speed cannot raise altitude
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {initialStage2Nav,stepStage2} from "./features/home/reentry/reentryStage2Navigation.ts";
          const people={japan:false,antarctic:false,visitor:false};
          let s=initialStage2Nav();
          const originalAltitude=s.altitude;
          for(let i=0;i<180;i++) {
            s=stepStage2(s,{steerX:0,steerY:0,thrust:1},1/60,people);
            assert.equal(s.targetAltitude,originalAltitude,"POWER altered altitude setpoint");
            assert.ok(Math.abs(s.altitude-originalAltitude)<0.000001,
              "POWER moved body vertically: "+s.altitude);
          }
          assert.ok(s.targetSpeed>0,"Speed control did not accelerate");
          assert.ok(s.noseLift>0 && s.noseLift<=0.08501,
            "Expected subtle bow-up posture");
          const cruising=s.targetSpeed;
          for(let i=0;i<60;i++)s=stepStage2(s,{steerX:0,steerY:0,thrust:0},1/60,people);
          assert.equal(s.targetSpeed,cruising,"Release must hold cruise speed");
          assert.equal(s.altitude,originalAltitude,"Release must hold altitude");
          const withStick=stepStage2(s,{steerX:0,steerY:1,thrust:0},.05,people);
          assert.ok(withStick.targetAltitude>originalAltitude,"Only altitude stick may climb");
          console.log("PASS: POWER/hold altitude invariant, mild bow tilt, stick climb");
          NODE
      - run: npx tsc --noEmit
      - run: npx eslint features/home/reentry/ReentryStage2Prototype.tsx features/home/reentry/reentryStage2Navigation.ts features/home/reentry/ReentryPresentationCanvas.tsx features/home/reentry/reentryStageTimeline.ts
      - run: npm run build
